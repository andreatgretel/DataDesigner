name: Agentic CI - Proof of Concept

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to Claude"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  poc:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.AGENTIC_CI_API_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENTIC_CI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT='${{ github.event.inputs.prompt }}'
          DEFAULT_PROMPT="List the top 3 most important files in this repo and explain why in one sentence each. Be concise."
          FINAL_PROMPT="${PROMPT:-$DEFAULT_PROMPT}"

          echo "=== Running Claude via Inference API ==="
          echo "Prompt: $FINAL_PROMPT"

          RESULT=$(claude \
            --model "aws/anthropic/bedrock-claude-opus-4-6" \
            -p "$FINAL_PROMPT" \
            --max-turns 1 \
            --allowedTools "Read,Glob,Grep" \
            2>&1)

          echo "=== Claude Output ==="
          echo "$RESULT"

          # Write body to a temp file to avoid quoting issues
          cat > /tmp/issue-body.md <<BODY_EOF
          **Prompt:** $FINAL_PROMPT

          **Response:**

          $RESULT

          ---
          *Posted by agentic CI proof-of-concept run*
          BODY_EOF

          gh issue create \
            --title "Agentic CI PoC - $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body-file /tmp/issue-body.md
