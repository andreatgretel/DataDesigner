name: Agentic CI - Proof of Concept

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to Claude"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  poc:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug environment
        run: |
          echo "=== Claude CLI ==="
          which claude || echo "claude not in PATH"
          claude --version || echo "claude --version failed"
          echo ""
          echo "=== PATH ==="
          echo "$PATH"
          echo ""
          echo "=== Node ==="
          node --version || echo "no node"
          echo ""
          echo "=== Secrets set? ==="
          if [ -n "$API_URL" ]; then echo "AGENTIC_CI_API_BASE_URL: set"; else echo "AGENTIC_CI_API_BASE_URL: NOT SET"; fi
          if [ -n "$API_KEY" ]; then echo "AGENTIC_CI_API_KEY: set"; else echo "AGENTIC_CI_API_KEY: NOT SET"; fi
        env:
          API_URL: ${{ secrets.AGENTIC_CI_API_BASE_URL }}
          API_KEY: ${{ secrets.AGENTIC_CI_API_KEY }}

      - name: Test Claude
        if: success()
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.AGENTIC_CI_API_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENTIC_CI_API_KEY }}
        run: |
          claude --model "aws/anthropic/bedrock-claude-opus-4-6" -p "Say hello" --max-turns 1 2>&1 || true
