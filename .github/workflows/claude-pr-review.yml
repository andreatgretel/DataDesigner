name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-diff.txt

      - name: Review PR with Claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude -p "You are reviewing PR #${PR_NUMBER} in this repo.

          The diff is in /tmp/pr-diff.txt. Review the changes for:
          - Bugs and logic errors
          - Security vulnerabilities
          - Code quality issues

          Be concise. Only flag real issues, not style nits.

          When done, post your review as a PR comment using:
            gh pr comment ${PR_NUMBER} --body \"<your review>\"

          If everything looks good, just post a short approval comment." \
            --allowedTools "Bash,Read,Glob,Grep"
